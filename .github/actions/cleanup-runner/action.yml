name: Cleanup self-hosted runner
description: >
  Remove the per-run setup-pnpm directory created by this job, keyed by
  check_run_id so the cleanup is strictly scoped to this run and cannot 
  affect concurrent jobs. Runs as the final step of every self-hosted job
  with `if: always()` so disk is reclaimed even on failure or cancellation.

inputs:
  check-run-id:
    description: The job's check_run_id used to namespace per-run directories.
    required: true
  runner-temp:
    description: The runner's temp directory (runner.temp) where setup-pnpm was created.
    required: true

runs:
  using: composite
  steps:    
    - name: Remove installed dependencies and outputs
      shell: bash
      run: |
        rm -rf node_modules
        rm -rf libs/*/node_modules libs/*/dist libs/*/build
        rm -rf .npmrc

    - name: Reclaim runner disk
      shell: bash
      env:
        CHECK_RUN_ID: ${{ inputs.check-run-id }}
        RUNNER_TEMP_DIR: ${{ inputs.runner-temp }}
      run: |
        rm -rf "${RUNNER_TEMP_DIR}/setup-pnpm-${CHECK_RUN_ID}" 2>/dev/null || true