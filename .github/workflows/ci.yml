name: CI Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["**/*.md", "docs/**", "*.png", "*.svg"]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: CI checks
    runs-on: [self-hosted, qm-dev-ubuntu]
    environment: continuous-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm-${{ job.check_run_id }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Nx outputs
        uses: actions/cache@v5
        with:
          path: .nx
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}   
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
   
      - name: CI Checks
        uses: ./.github/actions/run-ci

      - name: Cleanup runner
        if: always()
        uses: ./.github/actions/cleanup-runner
        with:
          check-run-id: ${{ job.check_run_id }}
          runner-temp: ${{ runner.temp }}
